name: Bug report
description: Report reproducible incorrect behavior in Backtrace.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not attach real assistant transcripts, credentials, or private source code.
  - type: input
    id: version
    attributes:
      label: Backtrace version
      placeholder: 0.1.1 (2)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15.5, Apple M2
    validations:
      required: true
  - type: dropdown
    id: assistant
    attributes:
      label: Assistant
      options:
        - Codex
        - Claude Code
        - Grok Build
        - OpenCode
        - App-wide / not provider-specific
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open Backtrace
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted screenshots or synthetic data only.
